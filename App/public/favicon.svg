<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Container Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#09090b" stroke="#27272a" stroke-width="2" />

  <!-- Subtle Structural Synapses (Feed-forward network topology) -->
  <g stroke="#27272a" stroke-width="2.5" stroke-linecap="round">
    <line x1="36" y1="90" x2="64" y2="64" />
    <line x1="64" y1="64" x2="92" y2="38" />
  </g>

  <!-- Gradient for the active "N" pathway -->
  <defs>
    <linearGradient id="n-path" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Active "N" Synaptic Core Pathway -->
  <path d="M 36 90 L 36 38 L 64 64 L 92 90 L 92 38" 
        fill="none" 
        stroke="url(#n-path)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Layer 1: Input Neurons -->
  <circle cx="36" cy="90" r="6" fill="#2563eb" stroke="#09090b" stroke-width="2" />
  <circle cx="36" cy="38" r="6.5" fill="#f8fafc" stroke="#09090b" stroke-width="2" />

  <!-- Layer 2: Hidden Neuron (Center focal unit) -->
  <circle cx="64" cy="64" r="7.5" fill="#3b82f6" stroke="#09090b" stroke-width="2" />
  <circle cx="64" cy="64" r="3" fill="#ffffff" />

  <!-- Layer 3: Output Neurons -->
  <circle cx="92" cy="90" r="6" fill="#3b82f6" stroke="#09090b" stroke-width="2" />
  <circle cx="92" cy="38" r="6.5" fill="#f8fafc" stroke="#09090b" stroke-width="2" />
</svg>